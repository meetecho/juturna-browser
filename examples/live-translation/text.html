<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>juturna: live translation - text</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../demo.css">
</head>
<body>
<header class="brand"><div class="wrap">
  <a class="logo" href="../../index.html"><picture><source srcset="../img/juturna-logo-dark.png" media="(prefers-color-scheme: dark)"><img src="../img/juturna-logo.png" alt="Juturna" width="45" height="40"></picture> demos</a>
  <a class="back" href="../../index.html">← All demos</a>
</div></header>
<main class="wrap">
  <h1>Live translation - text</h1>

  <div class="panel">
    <h2>Settings</h2>
    <form id="settings">
      <div class="row">
        <label>target language
          <select id="target-lang">
            <option value="it">italiano</option>
            <option value="es">español</option>
            <option value="zh">中文</option>
            <option value="de">deutsch</option>
          </select>
        </label>
        <label>debounce (ms)
          <input id="debounce-ms" type="number" min="200" max="5000" step="100" value="500" style="width:5.5em">
        </label>
        <label><span>max threads <span title="onnxruntime-web's WASM pool for translate_opus. Empty = auto (min(4, cores/2)).">ⓘ</span></span>
          <input id="max-threads" type="number" min="1" max="16" step="1" placeholder="auto" style="width:5em">
        </label>
      </div>
    </form>
  </div>

  <div class="actions">
    <button id="start" class="btn primary">Start</button>
    <button id="stop" class="btn" disabled>Stop</button>
  </div>

  <textarea id="text" rows="3" placeholder="type in english..." disabled></textarea>
  <p id="status"></p>
  <div id="current"></div>
  <div id="lines"></div>
  <pre id="log"></pre>
</main>
<script type="module">
import { Juturna } from '../../src/juturna.js';
import { withTelemetry, showTelemetry } from '../telemetry.js';
import { models } from '../models.js';

const MODEL_ID = {
  it: 'Xenova/opus-mt-en-it',
  es: 'Xenova/opus-mt-en-es',
  zh: 'Xenova/opus-mt-en-zh',
  de: 'Xenova/opus-mt-en-de',
};

const $ = (id) => document.getElementById(id);
const log = (m) => { $('log').textContent += m + '\n'; };
const url = (path) => new URL(path, location.href).href;
const vendor = (path) => url('../../vendor/' + path);

const query = new URLSearchParams(location.search);
if (query.has('target') && MODEL_ID[query.get('target')]) {
  $('target-lang').value = query.get('target');
}
if (query.has('debounce')) $('debounce-ms').value = query.get('debounce');
if (query.has('maxThreads')) $('max-threads').value = query.get('maxThreads');

function buildConfig() {
  const targetLang = $('target-lang').value;
  const maxThreadsRaw = $('max-threads').value;
  const maxThreads = maxThreadsRaw !== '' ? Number(maxThreadsRaw) : null;

  return {
    pipeline: {
      name: 'tt', id: 'tt-1', folder: '/tmp/juturna/tt', transport: 'browser',
      nodes: [
        { name: 'in', type: 'BrowserInput', configuration: {} },
        { name: 'mt', type: 'extensions.nodes.TranslateOpus', worker: 'mt', configuration: {
          transformers_url: vendor('translate_opus/transformers/transformers.min.js'),
          wasm_mjs_url: vendor('translate_opus/transformers/ort-wasm-simd-threaded.asyncify.mjs'),
          wasm_bin_url: vendor('translate_opus/transformers/ort-wasm-simd-threaded.asyncify.wasm'),
          ...models('translate_opus', MODEL_ID[targetLang]),
          source_lang: 'en', target_lang: targetLang,
          max_threads: maxThreads,
        } },
        { name: 'out', type: 'BrowserOutput', configuration: {} },
      ],
      links: [{ from: 'in', to: 'mt' }, { from: 'mt', to: 'out' }],
    },
  };
}

let jt, pipe, input, debounceTimer = null;

function setControlsDisabled(disabled) {
  for (const el of $('settings').elements) el.disabled = disabled;
}

$('start').onclick = async () => {
  $('start').disabled = true;
  setControlsDisabled(true);
  $('status').textContent = 'loading juturna and the model...';
  try {
    jt = await Juturna.create({ workers: ['main', 'mt'] });
    pipe = await jt.pipeline(withTelemetry(buildConfig()));
    showTelemetry(pipe);
    input = pipe.input('in');
    pipe.onError((e) => log('ERROR: ' + e.message));
    pipe.output('out').on('message', onTranslation);
    await pipe.start();
    $('status').textContent = 'ready, type something.';
    $('text').disabled = false;
    $('stop').disabled = false;
  } catch (err) {
    $('status').textContent = 'ERROR: ' + err;
    log('ERROR: ' + err);
    $('start').disabled = false;
    setControlsDisabled(false);
  }
};

$('stop').onclick = async () => {
  $('stop').disabled = true;
  $('text').disabled = true;
  clearTimeout(debounceTimer);
  await pipe.stop();
  await pipe.destroy();
  jt.terminate();
  $('status').textContent = 'stopped. change language and press Start to restart.';
  $('current').textContent = '';
  $('start').disabled = false;
  setControlsDisabled(false);
};

// what a model wrote or the user typed is text, never markup
function translated(payload) {
  const source = document.createElement('b');
  source.textContent = payload.source_text;
  return [source, document.createElement('br'), ` > ${payload.text}`];
}

function onTranslation({ payload, meta }) {
  if (meta && meta.final) {
    const line = document.createElement('p');
    line.append(...translated(payload));
    $('lines').prepend(line);
    $('current').textContent = '';
    $('status').textContent = 'ready, type something.';
  } else {
    // Not final: overwrites the current line, only Enter fixes it below.
    const preview = document.createElement('p');
    preview.append(...translated(payload));
    $('current').replaceChildren(preview);
    $('status').textContent = 'ready, type something.';
  }
}

function send(text, final) {
  // meta.final travels through to the output message (translate_opus
  // copies message.meta), so onTranslation knows whether to overwrite
  // the current line or fix it.
  input.feed({ kind: 'object', payload: { text }, meta: { final } });
}

$('text').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const text = $('text').value.trim();
  if (!text) return;

  $('status').textContent = 'waiting for you to stop typing...';
  const debounceMs = Number($('debounce-ms').value) || 500;
  debounceTimer = setTimeout(() => {
    $('status').textContent = 'translating...';
    send(text, false);
  }, debounceMs);
});

$('text').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  clearTimeout(debounceTimer);
  const text = $('text').value.trim();
  if (!text) return;

  $('status').textContent = 'translating...';
  send(text, true);
  $('text').value = '';
});
</script>
</body></html>
