# Third-party files whisper_asr loads at run time, fetched into vendor/ by
# `python3 build/vendor.py`. `path` is relative to vendor/.

# transformers.js: tokenizer, feature extraction and the generation loop for
# Whisper, on top of onnxruntime-web. Apache-2.0.
[[asset]]
url = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0/dist/transformers.min.js"
path = "whisper_asr/transformers/transformers.min.js"
sha256 = "1475fd440e9932ab206682ee42cb18f6097403e9ee77ea62084c592d0f83597d"
license = "Apache-2.0"

# onnxruntime-web, the exact dev build this version of transformers.js depends
# on (its own package.json: "onnxruntime-web": "1.31.0-dev.20260914-8d85527a0").
# Pinning the stable 1.22.0 already vendored for person_mask/denoise_dfn does
# NOT work here: this build's JS glue only ships the ".asyncify" WASM variant,
# absent from 1.22.0 (verified: pointing wasmPaths at 1.22.0 fails to fetch a
# dynamically imported module, "no available backend found").
[[asset]]
url = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.0-dev.20260914-8d85527a0/dist/ort-wasm-simd-threaded.asyncify.mjs"
path = "whisper_asr/transformers/ort-wasm-simd-threaded.asyncify.mjs"
sha256 = "0966b6105cd936744498aa60df7a22cbd47af3374dbc64a9ab561c08a71e3611"
license = "MIT"

[[asset]]
url = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.0-dev.20260914-8d85527a0/dist/ort-wasm-simd-threaded.asyncify.wasm"
