<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Background blur with canvas compositing · Juturna</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Blurs the background of your webcam video with a segmentation model running in the browser tab and the blur drawn on the page canvas; the video never leaves your device.">
<meta property="og:title" content="Background blur with canvas compositing · Juturna">
<meta property="og:description" content="Blurs the background of your webcam video with a segmentation model running in the browser tab and the blur drawn on the page canvas; the video never leaves your device.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://meetecho.github.io/juturna/demos/examples/video-blur/canvas.html">
<link rel="stylesheet" href="../demo.css">
</head>
<body>
<header class="brand"><div class="wrap">
  <a class="logo" href="../../index.html"><picture><source srcset="../img/juturna-logo-dark.png" media="(prefers-color-scheme: dark)"><img src="../img/juturna-logo.png" alt="Juturna" width="45" height="40"></picture> demos</a>
  <a class="back" href="../../index.html">← All demos</a>
</div></header>
<main class="wrap">
  <h1>Background blur - canvas compositing</h1>

  <div class="panel">
    <h2>Settings</h2>
    <form id="settings">
      <div class="row">
        <label><span>max threads <span title="onnxruntime-web's WASM pool for person_mask. Empty = auto (min(4, cores/2)).">ⓘ</span></span>
          <input id="max-threads" type="number" min="1" max="16" step="1" placeholder="auto" style="width:5em">
        </label>
      </div>
    </form>
  </div>

  <div class="actions">
    <button id="start" class="btn primary">Start</button>
    <button id="stop" class="btn" disabled>Stop</button>
  </div>

  <canvas id="out"></canvas>
  <table>
    <tr><th>frames shown</th><td id="shown">0</td><th>fps</th><td id="fps">-</td></tr>
    <tr><th>latency (capture  > canvas)</th><td id="lat">-</td><th>dropped</th><td id="dropped">0</td></tr>
    <tr><th>segment (ms)</th><td id="seg">-</td><th>composite (ms)</th><td id="comp">-</td></tr>
  </table>
  <pre id="log"></pre>
  <video id="cam" playsinline muted hidden></video>
</main>
<footer class="site-foot"><div class="wrap">
  <p>Built with Juturna. <a href="https://meetecho.github.io/juturna/index.html#quick-start">Start with the quick start</a></p>
  <p>Need this in production? <a href="https://meetecho.github.io/juturna/work_with_meetecho.html">Work with Meetecho</a></p>
</div></footer>
<script type="module">
import { Juturna } from '../../src/juturna.js';
import { withTelemetry, showTelemetry } from '../telemetry.js';

const query = new URLSearchParams(location.search);          // ?fps=24&inflight=3&blur=10
const W = Number(query.get('width') ?? 640), H = Number(query.get('height') ?? 480);
const FPS = Number(query.get('fps') ?? 24), MAX_IN_FLIGHT = Number(query.get('inflight') ?? 3);
const BLUR_PX = Number(query.get('blur') ?? 10);
const $ = (id) => document.getElementById(id);
const log = (m) => { $('log').textContent += m + '\n'; };
const url = (path) => new URL(path, location.href).href;

if (query.has('maxThreads')) $('max-threads').value = query.get('maxThreads');

function setControlsDisabled(disabled) {
  for (const el of $('settings').elements) el.disabled = disabled;
}

// Only person_mask - the blur and compositing happen in this canvas.
function buildConfig() {
  const maxThreadsRaw = $('max-threads').value;
  const maxThreads = maxThreadsRaw !== '' ? Number(maxThreadsRaw) : null;
  const transport = { name: 'browser', max_payload_bytes: Math.max(2000000, W * H * 4 + 4096) };

  return { pipeline: { name: 'blur', id: 'blur-canvas-1', folder: '/tmp/juturna/blur-canvas', transport,
    nodes: [
      { name: 'in', type: 'BrowserInput', configuration: {} },
      { name: 'mask', type: 'extensions.nodes.PersonMask', worker: 'ml',
        configuration: { ort_url: url('../../vendor/person_mask/ort/ort.wasm.min.mjs'), wasm_path: url('../../vendor/person_mask/ort/'),
                         model_url: url('../../vendor/person_mask/selfie.onnx'), max_threads: maxThreads } },
      { name: 'out', type: 'BrowserOutput', configuration: {} },
    ],
    links: [{ from: 'in', to: 'mask' }, { from: 'mask', to: 'out' }] } };
}

$('out').width = W; $('out').height = H;
const outCtx = $('out').getContext('2d');
const grab = new OffscreenCanvas(W, H).getContext('2d', { willReadFrequently: true });
// src: the raw RGB+mask frame, read twice (background, foreground).
const src = new OffscreenCanvas(W, H).getContext('2d', { willReadFrequently: true });
const bg = new OffscreenCanvas(W, H).getContext('2d');
const fg = new OffscreenCanvas(W, H).getContext('2d', { willReadFrequently: true });

let jt, pipe, input, stream, running = false, inFlight = 0, sent = 0, shown = 0, dropped = 0;
const lat = [], seg = [], comp = [], arrivals = [];

const median = (a) => { if (!a.length) return '-'; const s = [...a].sort((x, y) => x - y); return s[s.length >> 1].toFixed(1); };

function onFrame() {
  if (!running) return;
  if (inFlight >= MAX_IN_FLIGHT) dropped++;
  else {
    grab.drawImage($('cam'), 0, 0, W, H);
    const data = grab.getImageData(0, 0, W, H).data;
    inFlight++;
    input.feed({ kind: 'image', payload: { image: new Uint8Array(data.buffer), width: W, height: H, depth: 4, pixel_format: 'rgba', timestamp: sent },
                 meta: { t: performance.now(), i: sent++ } });
  }
  $('cam').requestVideoFrameCallback(onFrame);
}

function onOutput({ payload, meta }) {
  inFlight--;
  const t0 = performance.now();

  // person_mask returns the same RGB, with the mask (graded, not binary)
  // in place of alpha.
  const full = new Uint8ClampedArray(payload.image);

  // background: same RGB, full alpha - otherwise the blur would read
  // from the mask instead of a flat 255.
  const bgSrc = new Uint8ClampedArray(full);
  for (let i = 3; i < bgSrc.length; i += 4) bgSrc[i] = 255;
  src.putImageData(new ImageData(bgSrc, payload.width, payload.height), 0, 0);
  bg.clearRect(0, 0, payload.width, payload.height);
  bg.filter = `blur(${BLUR_PX}px)`;
  bg.drawImage(src.canvas, 0, 0);
  bg.filter = 'none';

  // foreground: RGB + mask as alpha, unchanged - drawImage respects the
  // per-pixel alpha, so the mask's soft edge blends instead of cutting.
  fg.clearRect(0, 0, payload.width, payload.height);
  fg.putImageData(new ImageData(full, payload.width, payload.height), 0, 0);

  outCtx.clearRect(0, 0, payload.width, payload.height);
  outCtx.drawImage(bg.canvas, 0, 0);
  outCtx.drawImage(fg.canvas, 0, 0);

  shown++;
  const now = performance.now();
  lat.push(now - meta.t); seg.push(meta.ms_segment); comp.push(now - t0); arrivals.push(now);
  for (const a of [lat, seg, comp]) if (a.length > 60) a.shift();
  while (arrivals.length && now - arrivals[0] > 2000) arrivals.shift();
}

setInterval(() => {
  $('shown').textContent = shown; $('dropped').textContent = dropped;
  $('fps').textContent = arrivals.length > 1 ? ((arrivals.length - 1) / ((arrivals.at(-1) - arrivals[0]) / 1000)).toFixed(1) : '-';
  $('lat').textContent = median(lat) + ' ms'; $('seg').textContent = median(seg); $('comp').textContent = median(comp);
}, 500);

$('start').onclick = async () => {
  $('start').disabled = true;
  setControlsDisabled(true);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: W, height: H, frameRate: FPS } });
    log('loading juturna in 2 workers (main, ml)...');
    const t0 = performance.now();
    jt = await Juturna.create({ workers: ['main', 'ml'] });
    pipe = await jt.pipeline(withTelemetry(buildConfig()));
    showTelemetry(pipe);
    pipe.onError((e) => log('ERROR: ' + e.message));
    pipe.output('out').on('message', onOutput);
    input = pipe.input('in');
    await pipe.start();
    log(`pipeline running (${Math.round(performance.now() - t0)} ms to get there)`);

    $('cam').srcObject = stream;
    await $('cam').play();
    running = true;
    $('cam').requestVideoFrameCallback(onFrame);
    $('stop').disabled = false;
  } catch (err) {
    log('ERROR: ' + err);
    $('start').disabled = false;
    setControlsDisabled(false);
  }
};

$('stop').onclick = async () => {
  $('stop').disabled = true;
  running = false;
  stream.getTracks().forEach((t) => t.stop());
  await pipe.stop();
  log('status after stop: ' + JSON.stringify((await pipe.status()).workers));
  await pipe.destroy();
  jt.terminate();
  log('done');
  setControlsDisabled(false);
};
</script>
</body></html>
