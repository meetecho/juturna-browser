name: Release Please

# release-please reads release-please-config.json from main, and the
# release-as input of the action is ignored with a config file: to force a
# version, push a commit with a `Release-As: x.y.z` footer
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # npm trusted publishing: the registry trusts this workflow through OIDC, no
  # token is stored in the repository; it needs npm 11.5.1 or later and adds
  # the provenance attestation by itself (public repository only)
  npm-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # the release tag, not github.sha: a commit merged after the release
      # would be published under the released version
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm publish --access public
