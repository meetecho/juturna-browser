name: Linting

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the same version as in .pre-commit-config.yaml
      - name: Install Ruff
        run: pip install ruff==0.16.10

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install ESLint
        run: npm ci

      - name: Run ESLint
        run: npm run lint
