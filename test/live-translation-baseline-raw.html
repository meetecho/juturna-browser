<!doctype html>
<html>
<head><meta charset="utf-8"><title>whisper raw baseline</title></head>
<body>
<!--
DIAGNOSTICO TEMPORANEO, non committare (design/STATO-live-translation.md).
Stessa finestra di JFK, stesso modello/wasm vendorati, stesso q8, ma
transformers.js chiamato direttamente dalla pagina: niente Pyodide, niente
Worker dedicato, niente Juturna. Serve a verificare se il claim "2,1s per
2s di JFK" della sessione precedente e' reale, isolando se la lentezza e'
del modello/ambiente in generale o specifica del percorso Pyodide/Worker.
-->
<button id="b2">2s</button>
<button id="b3">3s</button>
<button id="b4">4s</button>
<pre id="out">pronto</pre>
<script type="module">
import { pipeline, env } from '../vendor/whisper_asr/transformers/transformers.min.js';

const out = document.getElementById('out');
const log = (s) => { out.textContent += '\n' + s; console.log(s); };
const url = (path) => new URL(path, location.href).href;

const JFK_URL =
  'https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/jfk.wav';
const SR = 16000;

// Workaround per il bug del tokenizer (vedi design/CLAUDE.md): il
// pre-check "locale" di transformers.js (Nn/Pt, usato solo da
// AutoTokenizer/AutoProcessor) scarta ogni localModelPath che sia un
// URL http(s) - l'unica forma possibile in un browser - quindi non
// trova mai tokenizer.json/tokenizer_config.json e la pipeline si rompe
// con `.tokenizer`/`.processor` null. Il ramo "remote" non ha questo
// gate: puntandolo al nostro stesso server locale (invece che a
// huggingface.co) i file vendorati si caricano correttamente.
env.allowLocalModels = false;
env.allowRemoteModels = true;
env.remoteHost = url('../vendor/whisper_asr/models/');
env.remotePathTemplate = '{model}/';
env.backends.onnx.wasm.wasmPaths = {
  mjs: url('../vendor/whisper_asr/transformers/ort-wasm-simd-threaded.asyncify.mjs'),
  wasm: url('../vendor/whisper_asr/transformers/ort-wasm-simd-threaded.asyncify.wasm'),
};
const cores = navigator.hardwareConcurrency || 4;
env.backends.onnx.wasm.numThreads = Math.max(2, Math.floor(cores / 2));

let asr = null;
let jfkSamples = null;

async function loadModel() {
  if (asr) return asr;
  log('carico il modello (stesso vendor di whisper_asr)...');
  const t0 = performance.now();
  asr = await pipeline('automatic-speech-recognition', 'Xenova/whisper-base', { dtype: 'q8' });
  log('modello pronto in ' + Math.round(performance.now() - t0) + 'ms');
  log(
    'asr.processor=' + (asr.processor ? 'ok(' + asr.processor.constructor?.name + ')' : 'NULL') +
    ' asr.tokenizer=' + (asr.tokenizer ? 'ok(' + asr.tokenizer.constructor?.name + ')' : 'NULL') +
    ' asr.model=' + (asr.model ? 'ok(' + asr.model.constructor?.name + ')' : 'NULL'),
  );
  return asr;
}

async function loadJfk() {
  if (jfkSamples) return jfkSamples;
  log('scarico ' + JFK_URL + ' ...');
  const resp = await fetch(JFK_URL);
  const buf = await resp.arrayBuffer();
  const probeCtx = new OfflineAudioContext(1, 1, SR);
  const decoded = await probeCtx.decodeAudioData(buf.slice(0));
  if (decoded.sampleRate === SR && decoded.numberOfChannels === 1) {
    jfkSamples = decoded.getChannelData(0).slice();
  } else {
    const off = new OfflineAudioContext(1, Math.ceil(decoded.duration * SR), SR);
    const src = off.createBufferSource();
    src.buffer = decoded;
    src.connect(off.destination);
    src.start();
    jfkSamples = (await off.startRendering()).getChannelData(0).slice();
  }
  log('jfk caricato: ' + jfkSamples.length + ' campioni (sr originale ' + decoded.sampleRate + ')');
  return jfkSamples;
}

async function runLeg(seconds) {
  await loadModel();
  const samples = await loadJfk();
  const n = Math.min(Math.round(seconds * SR), samples.length);
  const chunk = samples.subarray(0, n);
  log(`\n=== leg ${seconds}s (pagina pura, niente Pyodide/Worker) ===`);
  const t0 = performance.now();
  const heartbeat = setInterval(() => {
    log('...ancora vivo, total_ms=' + Math.round(performance.now() - t0));
  }, 2000);
  try {
    const result = await asr(chunk, { language: 'english', task: 'transcribe' });
    log('risultato: ' + JSON.stringify(result));
  } catch (e) {
    log('eccezione: ' + (e && e.stack || e));
  } finally {
    clearInterval(heartbeat);
    log('done total_ms=' + Math.round(performance.now() - t0));
  }
}

document.getElementById('b2').onclick = () => runLeg(2.0);
document.getElementById('b3').onclick = () => runLeg(3.0);
document.getElementById('b4').onclick = () => runLeg(4.0);
</script>
</body>
</html>
