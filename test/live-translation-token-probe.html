<!doctype html>
<html>
<head><meta charset="utf-8"><title>whisper token probe</title></head>
<body>
<!--
DIAGNOSTICO TEMPORANEO, non committare (design/STATO-live-translation.md).
Trascrive una finestra di JFK reale alla volta (2s/3s/4s, un bottone per
finestra, mai in sequenza automatica) attraverso whisper_asr vero in un
Worker dedicato reale (via la facciata Juturna), per capire se il costo per
token cresce con la lunghezza della sequenza (ipotesi KV-cache). I log per
singolo token arrivano subito in console via performance.now(), non a fine
esecuzione, cosi' un blocco si localizza da solo invece di non produrre
nulla (a differenza del test precedente in questo filone).
Serve un bundle con: python3 build/build.py --juturna <juturna checkout>
--plugins examples/live-translation/plugins
-->
<p>Apri la Console (i timestamp per-token arrivano solo li').</p>
<button id="b2">2s</button>
<button id="b3">3s</button>
<button id="b4">4s</button>
<button id="b4t1">4s, numThreads=1</button>
<pre id="out">pronto</pre>
<script type="module">
import { Juturna } from '../src/juturna.js';

const out = document.getElementById('out');
const log = (s) => { out.textContent += '\n' + s; console.log(s); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const url = (path) => new URL(path, location.href).href;

// Il Worker dedicato posta qui i log per-token (vedi whisper_asr.py, la sua
// console non e' visibile a questa automazione). Un canale per esecuzione,
// aperto/chiuso a ogni leg cosi' i messaggi di un run precedente non si
// mescolano con quelli del prossimo.
let probeChannel = null;
function openProbeChannel() {
  if (probeChannel) probeChannel.close();
  probeChannel = new BroadcastChannel('whisper-probe');
  probeChannel.onmessage = (ev) => {
    const d = ev.data;
    if (d.kind === 'samples') {
      log(`[probe] samples ctor=${d.ctor} isView=${d.isView} length=${d.length}`);
    } else if (d.kind === 'heartbeat') {
      log(`[probe] ...ancora vivo, total_ms=${d.total_ms}`);
    } else if (d.kind === 'done') {
      log(`[probe] done total_ms=${d.total_ms}`);
    }
  };
}

const JFK_URL =
  'https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/jfk.wav';
const SR = 16000;
const TIMEOUT_MS = 30000;

const asrUrls = {
  transformers_url: url('../vendor/whisper_asr/transformers/transformers.min.js'),
  wasm_mjs_url: url('../vendor/whisper_asr/transformers/ort-wasm-simd-threaded.asyncify.mjs'),
  wasm_bin_url: url('../vendor/whisper_asr/transformers/ort-wasm-simd-threaded.asyncify.wasm'),
  models_url: url('../vendor/whisper_asr/models/'),
};

let jfkSamples = null;

async function loadJfk() {
  if (jfkSamples) return jfkSamples;
  log('scarico ' + JFK_URL + ' ...');
  const resp = await fetch(JFK_URL);
  if (!resp.ok) throw new Error('fetch jfk.wav: HTTP ' + resp.status);
  const buf = await resp.arrayBuffer();
  const probeCtx = new OfflineAudioContext(1, 1, SR);
  const decoded = await probeCtx.decodeAudioData(buf.slice(0));
  let samples;
  if (decoded.sampleRate === SR && decoded.numberOfChannels === 1) {
    samples = decoded.getChannelData(0).slice();
  } else {
    const off = new OfflineAudioContext(1, Math.ceil(decoded.duration * SR), SR);
    const src = off.createBufferSource();
    src.buffer = decoded;
    src.connect(off.destination);
    src.start();
    const rendered = await off.startRendering();
    samples = rendered.getChannelData(0).slice();
  }
  jfkSamples = samples;
  log(
    'jfk caricato: ' + samples.length + ' campioni (' +
    (samples.length / SR).toFixed(2) + 's, sr originale ' +
    decoded.sampleRate + ')',
  );
  return samples;
}

async function runLeg(seconds, numThreads) {
  const samples = await loadJfk();
  const n = Math.min(Math.round(seconds * SR), samples.length);
  const chunk = samples.subarray(0, n);
  log(`\n=== leg ${seconds}s (numThreads=${numThreads ?? 'default'}) ===`);

  const asrConfig = { ...asrUrls, window_seconds: seconds, overlap_seconds: 0 };
  if (numThreads !== undefined) asrConfig.num_threads = numThreads;

  const config = {
    pipeline: {
      name: 'probe', id: 'probe-1', folder: '/tmp/juturna/probe',
      transport: 'browser',
      nodes: [
        { name: 'in', type: 'BrowserInput', configuration: {} },
        { name: 'asr', type: 'extensions.nodes.WhisperASR', worker: 'asr', configuration: asrConfig },
        { name: 'out', type: 'BrowserOutput', configuration: {} },
      ],
      links: [{ from: 'in', to: 'asr' }, { from: 'asr', to: 'out' }],
    },
  };

  openProbeChannel();
  const jt = await Juturna.create({ workers: ['main', 'asr'] });
  let done = false;

  const timeout = setTimeout(() => {
    if (!done) {
      done = true;
      log('!!! TIMEOUT dopo ' + TIMEOUT_MS + 'ms, termino il worker');
      jt.terminate();
    }
  }, TIMEOUT_MS);

  try {
    const t0 = performance.now();
    const pipe = await jt.pipeline(config);
    log('pipeline pronta in ' + Math.round(performance.now() - t0) + 'ms (carico modello incluso)');
    pipe.output('out').on('message', (m) => {
      done = true;
      log('risultato: ' + JSON.stringify(m.payload));
    });
    pipe.onError((e) => log('errore pipeline: ' + e.message));
    const input = pipe.input('in');
    await pipe.start();

    const tFeed = performance.now();
    input.feed({ kind: 'audio', payload: { audio: chunk, sampling_rate: SR, channels: 1, start: 0 }, meta: {} });

    while (!done && performance.now() - tFeed < TIMEOUT_MS) {
      await sleep(300);
    }
    clearTimeout(timeout);
    if (!done) log('nessun output entro il timeout');
  } catch (e) {
    log('eccezione: ' + (e && e.stack || e));
  } finally {
    jt.terminate();
  }
}

window.runLeg = runLeg; // per lanciare varianti extra dalla console/automazione
document.getElementById('b2').onclick = () => runLeg(2.0);
document.getElementById('b3').onclick = () => runLeg(3.0);
document.getElementById('b4').onclick = () => runLeg(4.0);
document.getElementById('b4t1').onclick = () => runLeg(4.0, 1);
</script>
</body>
</html>
