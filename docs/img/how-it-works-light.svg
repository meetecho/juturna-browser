<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-label="The page and three Workers. The page calls feed(), which reaches BrowserInput in Worker main; BrowserInput sends to person_mask in Worker ml, which sends to background_blur in Worker cpu, which sends back to BrowserOutput in Worker main, through rings in shared memory; BrowserOutput delivers to the page through on(message)."><style>svg{background:#f5f8fb}.bx{fill:#ffffff;stroke:#7d8f9d;stroke-width:1.5}.bx.core{stroke:#1a6dad;stroke-width:3;fill:#eef6fd}.bx.grp{fill:none;stroke:#7d8f9d;stroke-dasharray:2 4}.t{fill:#0f1d26;font:600 15px system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif}.t.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}.t.s{fill:#4b5d6b;font-weight:400;font-size:13px}.t.lab{fill:#4b5d6b;font-weight:700;font-size:12px;letter-spacing:.08em}.t.acc{fill:#1a6dad}.ln{stroke:#7d8f9d;stroke-width:1.8;fill:none}.ln.acc{stroke:#1a6dad;stroke-width:3}.ah{fill:#7d8f9d}.ah.acc{fill:#1a6dad}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah acc" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="bx grp" x="4" y="20" width="136" height="270" rx="14"/><text class="t lab" x="20" y="44">PAGE</text>
<rect class="bx grp" x="156" y="20" width="164" height="270" rx="14"/><text class="t lab" x="172" y="44">WORKER MAIN</text>
<rect class="bx grp" x="340" y="20" width="164" height="270" rx="14"/><text class="t lab" x="356" y="44">WORKER ML</text>
<rect class="bx grp" x="524" y="20" width="172" height="270" rx="14"/><text class="t lab" x="540" y="44">WORKER CPU</text>
<rect class="bx" x="12" y="70" width="120" height="56" rx="12"/>
