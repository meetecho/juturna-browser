<text class="t m" x="422.0" y="103.0" text-anchor="middle">person_mask</text>
<rect class="bx" x="534" y="70" width="152" height="56" rx="12"/>
<text class="t m" x="610.0" y="103.0" text-anchor="middle">background_blur</text>
<rect class="bx" x="12" y="200" width="120" height="56" rx="12"/>
<text class="t m" x="72.0" y="233.0" text-anchor="middle">on('message')</text>
<rect class="bx" x="165" y="200" width="146" height="56" rx="12"/>
<text class="t m" x="238.0" y="233.0" text-anchor="middle">BrowserOutput</text>
